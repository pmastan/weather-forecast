
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#2563eb" />

    <!-- SEO Title -->
    <title>
      Weather Forecast – Live Weather &amp; 7-Day Forecast | Weatherly
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Check live weather forecasts for any city. Get current temperature, feels-like temperature, humidity, wind speed, and a 7-day weather forecast with Weatherly."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="weather forecast, live weather, today's weather, weather by city, 7-day weather forecast, temperature, humidity, wind speed"
    />

    <meta name="author" content="Weatherly" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: replace with your real deployed domain -->
    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weatherly" />
    <meta
      property="og:title"
      content="Weather Forecast – Live Weather &amp; 7-Day Forecast | Weatherly"
    />
    <meta
      property="og:description"
      content="Explore current weather conditions and a 7-day forecast for cities around the world."
    />
    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/weather-preview.png"
    />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Weather Forecast | Weatherly"
    />
    <meta
      name="twitter:description"
      content="Check current weather and 7-day forecasts for cities around the world."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/weather-preview.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
