<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Google Search Console Ownership Verification -->
    <meta
      name="google-site-verification"
      content="YOUR_ACTUAL_GOOGLE_VERIFICATION_CODE"
    />

    <!-- Website Title -->
    <title>Weather Forecast &amp; Live Weather | Weatherly</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Check current weather and a 7-day forecast for cities worldwide. Explore temperature, humidity, wind speed, feels-like temperature, and precipitation with Weatherly."
    />

    <!-- Search Engine Indexing -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta name="author" content="Weatherly" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://daily-weather-report-forecast.vercel.app/"
    />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weatherly" />

    <meta
      property="og:title"
      content="Weather Forecast &amp; Live Weather | Weatherly"
    />

    <meta
      property="og:description"
      content="Explore current weather conditions and 7-day forecasts for cities around the world."
    />

    <meta
      property="og:url"
      content="https://daily-weather-report-forecast.vercel.app/"
    />

    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter Metadata -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Weather Forecast | Weatherly"
    />

    <meta
      name="twitter:description"
      content="Check current weather, temperature, humidity, wind speed, and 7-day forecasts."
    />

    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Weatherly",
        "alternateName": "Daily Weather Report Forecast",
        "url": "https://daily-weather-report-forecast.vercel.app/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
